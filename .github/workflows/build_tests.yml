# This workflow will install Python dependencies, run tests and coverage
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: 
    - '**'
  pull_request:
    branches:
    - '**'
  schedule:
    - cron: '0 0 1 * *'
    
jobs:

  build_wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
      
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest]
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python for twine verification
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install twine and verify wheels
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install twine
        for wheel in ./wheelhouse/*.whl; do
          echo "Verifying wheel: $wheel"
          twine check "$wheel"
        done

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  test_wheels:
    name: Test wheels
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest]
      fail-fast: false
    steps:
    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        pattern: "cibw-wheels-*"
        merge-multiple: true
    - name: Install chama
      run: |
        python -m pip install --upgrade pip
        pip install wheel pyomo pandas<3.0 numpy>2.0 scipy
        pip install --no-index --pre --find-links=. chama
    - name: Import chama
      run: |
        python -c "import chama"

  run_coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Setup conda
      uses: s-weigand/setup-conda@v1
      with:
        update-conda: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        conda config --set always_yes yes --set changeps1 no
        python --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        conda install -y -c conda-forge glpk
        pip install coverage coveralls wntr
        python -m pip install -e .
    - name: Run Tests
      run: |
        export PATH=/usr/share/miniconda/bin:$PATH
        coverage erase
        coverage run --context=${{ matrix.os }}.py${{ matrix.python-version }} --source=chama --omit="*/tests/*" -m pytest --doctest-modules --doctest-glob="*.rst" chama
        coverage run --context=${{ matrix.os }}.py${{ matrix.python-version }} --source=chama --omit="*/tests/*" --append -m pytest --doctest-glob="*.rst" documentation
      env:
        COVERAGE_FILE: .coverage.${{ matrix.python-version }}.${{ matrix.os }}
    - name: Save coverage
      uses: actions/upload-artifact@v4
      with:
        name: .coverage.${{ matrix.python-version }}.${{ matrix.os }}
        path: .coverage.${{ matrix.python-version }}.${{ matrix.os }}

  combine_reports:
    needs: [ run_coverage ]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - uses: actions/checkout@v4
    - name: Install coverage
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coveralls
        python -m pip install -e .
    - name: Download coverage artifacts from test matrix
      uses: actions/download-artifact@v4
      with:
        name: coverage
    - name: Setup coverage and combine reports
      run: |
        echo "[paths]" > .coveragerc
        echo "source = " >> .coveragerc
        echo "    chama/" >> .coveragerc
        echo "    chama\\" >> .coveragerc
        echo "    D:\\a\\chama\\chama\\chama" >> .coveragerc
        echo "    /home/runner/work/chama/chama/chama" >> .coveragerc
        echo "    /Users/runner/work/chama/chama/chama" >> .coveragerc
        coverage combine
    - name: Create coverage report
      run: |
        coverage report
        coverage json --pretty-print
        coverage html --show-contexts
    - name: Save coverage JSON
      uses: actions/upload-artifact@v4
      with:
        name: coverage-json
        path: coverage.json
    - name: Save coverage html
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: htmlcov
    - name: Push to coveralls
      run: coveralls --service=github --rcfile=.coveragerc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
